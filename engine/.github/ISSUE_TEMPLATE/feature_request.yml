name: 功能建议
description: 希望新增的能力，或现有功能的改进
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先搜一下已有 issue，已经有人提过的话在那条下面点个 👍 或补充场景即可，不必重开。
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - 全部平台
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和困扰，而不是直接说方案。例如「写代码时经常想不起变量名的英文」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你设想的交互方式，包括按键、设置项、候选的显示方式等。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 其他输入法的参考
      description: 如果别的输入法（搜狗、微信、Rime、微软拼音等）已有类似功能，说一下它们怎么做的，有截图更好。
  - type: textarea
    id: extra
    attributes:
      label: 补充
